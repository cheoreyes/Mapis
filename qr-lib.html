                <div class="mt-4 inline-flex items-center gap-2 bg-slate-50 px-4 py-2 rounded-xl border border-slate-100">

                        <i class="ph-fill ph-device-mobile-slash text-2xl group-hover:scale-110 transition-transform"></i>

    <!-- LÓGICA JAVASCRIPT -->
    <script>
        let currentStudentHash = null;
        let isProcessing = false;
        let html5QrCode; 

        // --- 1. CONFIGURACIÓN DEL ESCÁNER ROBUSTO PARA MÓVILES ---
        async function startScanner() {
            const readerElement = document.getElementById('reader');
            readerElement.innerHTML = ''; 
            
            try {
                // Obtener lista de cámaras disponibles
                const devices = await Html5Qrcode.getCameras();
                
                if (!devices || devices.length === 0) {
                    throw new Error("No se detectaron cámaras");
                }

                // Seleccionar la cámara trasera
                let cameraId = devices[0].id; 
                
                for (let i = 0; i < devices.length; i++) {
                    if (devices[i].label.toLowerCase().includes('back') || 
                        devices[i].label.toLowerCase().includes('trasera') ||
                        devices[i].label.toLowerCase().includes('environment')) {
                        cameraId = devices[i].id;
                        break;
                    }
                }
                
                if (cameraId === devices[0].id && devices.length > 1) {
                    cameraId = devices[devices.length - 1].id;
                }

                html5QrCode = new Html5Qrcode("reader");
                
                const config = { 
                    fps: 10, 
                    qrbox: { width: 250, height: 250 },
                    aspectRatio: 1.0
                };

                await html5QrCode.start(cameraId, config, onScanSuccess, onScanFailure);
                
            } catch (err) {
                console.error("Error iniciando cámara:", err);
                readerElement.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full p-6 text-center text-red-600 bg-red-50 rounded-2xl border border-red-100">
                        <i class="ph-fill ph-camera-slash text-4xl mb-3"></i>
                        <p class="font-bold">Cámara no disponible</p>
                        <p class="text-xs mt-2 text-red-500">${err.message}</p>
                        <button onclick="location.reload()" class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-bold shadow-md">Reintentar</button>
                    </div>`;
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (isProcessing) return; 
            if (!decodedText || decodedText.length < 3) return;

            currentStudentHash = decodedText;
            
            if(html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('view-scanner').classList.add('hidden');
                    document.getElementById('view-action').classList.remove('hidden');
                    loadStudentDataMock(currentStudentHash);
                }).catch(err => console.error("Stop error", err));
            }
        }

        function onScanFailure(error) {}

        // --- 2. SIMULACIÓN DE DATOS ---
        function loadStudentDataMock(hash) {
            document.getElementById('student-name').innerText = "Mateo Sánchez";
            document.getElementById('student-grade').innerText = "3er Año A | ID: " + hash.substring(0,6);
            document.getElementById('current-balance').innerText = "875";
        }

        // --- 3. ENVÍO DE TRANSACCIÓN ---
        function sendTransaction(puntos, tipo, categoria) {
            if (isProcessing || !currentStudentHash) return;
            
            const nota = document.getElementById('optional-note').value;
            const data = {
                hashQR: currentStudentHash,
                puntos: puntos,
                tipoConducta: tipo,
                categoria: categoria,
                nota: nota,
                idDocente: 'DOC-MVP-01'
            };

            showStatus('loading');
            isProcessing = true;

            google.script.run
                .withSuccessHandler(function(response) {
                    isProcessing = false;
                    if (response && response.success) {
                        showStatus('success', `¡${puntos > 0 ? '+' : ''}${puntos} pts guardados!`);
                        if(response.nuevoSaldo !== undefined) {
                            document.getElementById('current-balance').innerText = response.nuevoSaldo;
                        }
                        document.getElementById('optional-note').value = '';
                        setTimeout(resetScanner, 2000);
                    } else {
                        showStatus('error', response ? response.error : 'Error desconocido');
                    }
                })
                .withFailureHandler(function(err) {
                    isProcessing = false;
                    showStatus('error', 'Error de red o servidor');
                })
                .registrarTransaccion(data);
        }

        // --- 4. UTILIDADES DE INTERFAZ ---
        function showStatus(type, msg) {
            const overlay = document.getElementById('overlay-status');
            const icon = document.getElementById('status-icon');
            const title = document.getElementById('status-title');
            const message = document.getElementById('status-msg');

            overlay.classList.remove('hidden');
            title.className = "font-bold text-xl mb-2"; 
            
            if (type === 'loading') {
                icon.innerText = '⏳';
                icon.className = "text-5xl mb-4 animate-pulse text-blue-500";
                title.innerText = 'Guardando...';
                title.classList.add('text-slate-800');
                message.innerText = 'Sincronizando con Google Sheets';
            } else if (type === 'success') {
                icon.innerText = '✅';
                icon.className = "text-5xl mb-4 text-emerald-500 scale-110";
                title.innerText = '¡Éxito!';
                title.classList.add('text-emerald-600');
                message.innerText = msg;
            } else {
                icon.innerText = '❌';
                icon.className = "text-5xl mb-4 text-red-500";
                title.innerText = 'Error';
                title.classList.add('text-red-600');
                message.innerText = msg;
            }
        }

        function resetScanner() {
            document.getElementById('overlay-status').classList.add('hidden');
            document.getElementById('view-action').classList.add('hidden');
            document.getElementById('view-scanner').classList.remove('hidden');
            startScanner(); 
            currentStudentHash = null;
            isProcessing = false;
        }

        window.onload = function() {
            startScanner();
        };
    </script>
